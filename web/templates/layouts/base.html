<!doctype html>
<html lang="en" class="h-full antialiased">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{if .Title}}{{.Title}} · {{end}}{{.Site.Name}}</title>
  {{if .Description}}<meta name="description" content="{{.Description}}">{{end}}
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/app.css">
  <script>
    // Apply the stored theme before first paint to avoid a flash of the wrong scheme.
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="min-h-full flex flex-col bg-white text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100">
  {{template "nav" .}}
  <main class="flex-1 w-full max-w-3xl mx-auto px-4 sm:px-6 py-12">
    {{template "content" .}}
  </main>
  {{template "footer" .}}
  <script src="/static/js/app.js" defer></script>
</body>
</html>
