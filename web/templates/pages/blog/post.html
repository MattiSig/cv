{{define "content"}}
<article class="pt-line">
  <header>
    <h1 class="title">{{.Data.Title}}</h1>
    {{if .Data.Summary}}<p>{{.Data.Summary}}</p>{{end}}
    <p class="text-muted"><time datetime="{{isoDate .Data.Date}}">{{isoDate .Data.Date}}</time>{{if .Data.Tags}} · {{join .Data.Tags ", "}}{{end}}</p>
  </header>
  <div class="prose mt-line border-t border-rule">
    {{.Data.HTML}}
  </div>
</article>
<p class="mt-[calc(var(--line)*2)]"><a href="/blog" class="link">All writing</a></p>
{{end}}
