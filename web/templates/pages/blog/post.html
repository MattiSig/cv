{{define "content"}}
<article>
  <header>
    <time datetime="{{isoDate .Data.Date}}" class="text-sm text-zinc-500 dark:text-zinc-400">{{date .Data.Date}}</time>
    <h1 class="mt-2 text-3xl sm:text-4xl font-semibold tracking-tight">{{.Data.Title}}</h1>
    {{if .Data.Summary}}<p class="mt-3 text-lg text-zinc-600 dark:text-zinc-400">{{.Data.Summary}}</p>{{end}}
    {{if .Data.Tags}}
    <ul class="mt-4 flex flex-wrap gap-2" aria-label="Tags">
      {{range .Data.Tags}}<li class="rounded-full border border-zinc-200 px-2.5 py-0.5 text-xs text-zinc-600 dark:border-zinc-700 dark:text-zinc-400">{{.}}</li>{{end}}
    </ul>
    {{end}}
  </header>
  <div class="prose prose-zinc dark:prose-invert mt-10 max-w-none">
    {{.Data.HTML}}
  </div>
</article>
<p class="mt-12"><a href="/blog" class="text-sm text-zinc-500 hover:text-zinc-900 dark:text-zinc-400 dark:hover:text-white">← All posts</a></p>
{{end}}
