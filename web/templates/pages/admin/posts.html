{{define "content"}}
<div class="flex items-center justify-between gap-[2ch] pt-line">
  <h1 class="title">Posts</h1>
  <a href="/admin/posts/new" class="btn btn-primary">new post</a>
</div>

{{if .Data.Posts}}
<ol class="mt-line border-t border-rule pt-line">
  {{range .Data.Posts}}
  <li class="row mb-line">
    <span class="row-date">{{isoDate .Date}}</span>
    <span>
      <a href="/admin/posts/{{.Slug}}/edit" class="link">{{.Title}}</a>
      {{if .Draft}}<span class="text-muted">(draft)</span>{{else}}<span class="text-muted">· <a href="/blog/{{.Slug}}" class="link">view</a></span>{{end}}
      <span class="block text-muted">/blog/{{.Slug}}</span>
    </span>
  </li>
  {{end}}
</ol>
{{else}}
<p class="mt-line text-muted">No posts yet.</p>
{{end}}
{{end}}
