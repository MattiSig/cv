{{define "content"}}
{{$p := .Data.Post}}
<div class="flex items-center justify-between gap-4">
  <h1 class="text-2xl font-semibold tracking-tight">{{if .Data.IsNew}}New post{{else}}Edit post{{end}}</h1>
  <a href="/admin/posts" class="text-sm text-zinc-500 hover:text-zinc-900 dark:text-zinc-400 dark:hover:text-white">← All posts</a>
</div>

<form method="post" action="{{if .Data.IsNew}}/admin/posts{{else}}/admin/posts/{{$p.Slug}}{{end}}" class="mt-8 space-y-6">
  <div class="grid gap-6 sm:grid-cols-2">
    <label class="block sm:col-span-2">
      <span class="text-sm font-medium">Title</span>
      <input name="title" value="{{$p.Title}}" required class="field mt-1">
    </label>
    <label class="block">
      <span class="text-sm font-medium">Slug</span>
      <input name="slug" value="{{$p.Slug}}" placeholder="derived from title" pattern="[a-z0-9]+(-[a-z0-9]+)*" class="field mt-1 font-mono">
    </label>
    <label class="block">
      <span class="text-sm font-medium">Date</span>
      <input name="date" type="date" value="{{isoDate $p.Date}}" required class="field mt-1">
    </label>
    <label class="block sm:col-span-2">
      <span class="text-sm font-medium">Summary</span>
      <input name="summary" value="{{$p.Summary}}" class="field mt-1">
    </label>
    <label class="block">
      <span class="text-sm font-medium">Tags</span>
      <input name="tags" value="{{join $p.Tags ", "}}" placeholder="go, teams" class="field mt-1">
    </label>
    <label class="flex items-center gap-2 self-end">
      <input name="draft" type="checkbox" {{if $p.Draft}}checked{{end}} class="h-4 w-4 rounded border-zinc-300 dark:border-zinc-700">
      <span class="text-sm font-medium">Draft</span>
    </label>
  </div>

  <label class="block">
    <span class="text-sm font-medium">Body <span class="font-normal text-zinc-500 dark:text-zinc-400">(Markdown)</span></span>
    <textarea name="body" rows="24" class="field mt-1 font-mono text-sm leading-relaxed" spellcheck="true">{{$p.Body}}</textarea>
  </label>

  <div class="flex items-center gap-3">
    <button type="submit" class="rounded-md bg-zinc-900 px-4 py-2 text-sm font-medium text-white hover:bg-zinc-700 dark:bg-white dark:text-zinc-900 dark:hover:bg-zinc-200">Save</button>
    {{if not .Data.IsNew}}{{if not $p.Draft}}<a href="/blog/{{$p.Slug}}" class="text-sm underline underline-offset-4">View live</a>{{end}}{{end}}
  </div>
</form>

{{if not .Data.IsNew}}
<form method="post" action="/admin/posts/{{$p.Slug}}/delete" class="mt-12 border-t border-zinc-200 pt-6 dark:border-zinc-800"
      onsubmit="return confirm('Delete this post? This cannot be undone.')">
  <button type="submit" class="text-sm text-red-600 hover:underline dark:text-red-400">Delete post</button>
</form>
{{end}}
{{end}}
