{{define "content"}}
{{$p := .Data.Post}}
<div class="flex items-center justify-between gap-[2ch] pt-line">
  <h1 class="title">{{if .Data.IsNew}}New post{{else}}Edit post{{end}}</h1>
  <a href="/admin/posts" class="link">all posts</a>
</div>

<form method="post" action="{{if .Data.IsNew}}/admin/posts{{else}}/admin/posts/{{$p.Slug}}{{end}}" class="mt-line border-t border-rule pt-line">
  <div class="grid gap-x-[4ch] gap-y-line sm:grid-cols-2">
    <label class="block sm:col-span-2">
      <span class="text-muted">title</span>
      <input name="title" value="{{$p.Title}}" required class="field">
    </label>
    <label class="block">
      <span class="text-muted">slug</span>
      <input name="slug" value="{{$p.Slug}}" placeholder="derived from title" pattern="[a-z0-9]+(-[a-z0-9]+)*" class="field">
    </label>
    <label class="block">
      <span class="text-muted">date</span>
      <input name="date" type="date" value="{{isoDate $p.Date}}" required class="field">
    </label>
    <label class="block sm:col-span-2">
      <span class="text-muted">summary</span>
      <input name="summary" value="{{$p.Summary}}" class="field">
    </label>
    <label class="block">
      <span class="text-muted">tags</span>
      <input name="tags" value="{{join $p.Tags ", "}}" placeholder="go, teams" class="field">
    </label>
    <label class="flex items-center gap-[1ch] self-end pb-[3px]">
      <input name="draft" type="checkbox" {{if $p.Draft}}checked{{end}} class="size-[1.2ch] accent-[var(--accent)]">
      <span>draft</span>
    </label>
  </div>

  <label class="mt-line block">
    <span class="text-muted">body (markdown)</span>
    <textarea name="body" rows="24" class="field" spellcheck="true">{{$p.Body}}</textarea>
  </label>

  <div class="mt-line flex items-center gap-[2ch]">
    <button type="submit" class="btn btn-primary">save</button>
    {{if not .Data.IsNew}}{{if not $p.Draft}}<a href="/blog/{{$p.Slug}}" class="link">view live</a>{{end}}{{end}}
  </div>
</form>

{{if not .Data.IsNew}}
<form method="post" action="/admin/posts/{{$p.Slug}}/delete" class="mt-[calc(var(--line)*2)] border-t border-rule pt-line"
      onsubmit="return confirm('Delete this post? This cannot be undone.')">
  <button type="submit" class="link cursor-pointer">delete post</button>
</form>
{{end}}
{{end}}
