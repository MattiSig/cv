{{define "nav"}}
<header class="print:hidden border-b border-zinc-200 dark:border-zinc-800">
  <nav class="max-w-3xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between gap-6" aria-label="Main">
    <a href="/" class="font-semibold tracking-tight">{{.Site.Name}}</a>
    <ul class="flex items-center gap-5 text-sm">
      {{range $item := navItems}}
      <li>
        <a href="{{$item.Href}}"
           class="hover:text-zinc-900 dark:hover:text-white {{if hasPrefix $.Path $item.Href}}text-zinc-900 dark:text-white{{else}}text-zinc-500 dark:text-zinc-400{{end}}"
           {{if hasPrefix $.Path $item.Href}}aria-current="page"{{end}}>{{$item.Label}}</a>
      </li>
      {{end}}
      <li>
        <button type="button" data-theme-toggle
                class="rounded-md p-1.5 text-zinc-500 hover:text-zinc-900 dark:text-zinc-400 dark:hover:text-white"
                aria-label="Toggle dark mode">
          <svg class="h-4 w-4 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="h-4 w-4 hidden dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>
        </button>
      </li>
    </ul>
  </nav>
</header>
{{end}}
