  - slug: katbjo
    name: Katrín Björnsdóttir, biologist
    tagline: Academic site for a tundra ecologist.
    description: >-
      CV and publications for a biologist studying how tundra ecosystems respond to climate
      change. Plain HTML and CSS on GitHub Pages. I wrote it.
    url: https://katbjo.github.io/
    repo: https://github.com/katbjo/katbjo.github.io
    role: Built
    stack: [HTML, CSS, GitHub Pages]
