      builder, publishing, and custom domains. Icelandic first. A side project I build and run.
    url: https://snaelda.io
    role: Side project
    period: 2026 – now
    stack: [Go, TypeScript, Postgres, Railway]
    featured: true
    image: /static/img/snaelda/snaelda-og.webp
